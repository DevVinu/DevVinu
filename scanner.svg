<svg width="1000" height="10" viewBox="0 0 1000 10" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dual-color gradient -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0" />
      <stop offset="40%" stop-color="#00FF41" stop-opacity="1" />
      <stop offset="80%" stop-color="#00FFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Faint background track -->
  <rect x="0" y="4" width="1000" height="2" fill="#00FF41" opacity="0.15" />
  
  <!-- The moving dual-color laser -->
  <rect y="3" width="400" height="4" fill="url(#laser)">
    <animate attributeName="x" from="-400" to="1000" dur="2s" repeatCount="indefinite" />
  </rect>
</svg>
